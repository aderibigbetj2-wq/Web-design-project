<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Techify</title>
    <link rel="stylesheet" href="css/main.css"/>
</head>
<body>

    <header class="site-header">
        <div class="logo-wrap">
            <img src="img/logo.svg" class="logo" alt="Techify logo">
            <h1>Techify</h1>
        </div>

       
        <input type="search" id="search" placeholder="Search gadgets, laptops, phones...">
       

        <nav>
            <a href="index.html">Home</a>
            <a href="#">Shop</a>
            <a href="#">Deals</a>
            <a href="#">Support</a>
            <a href="#">Account</a>
            <a href="cart.html" id="cartLink">Cart (0)</a>
        </nav>
    </header>


    <main class="container">
    
      <aside class="filters">
        <fieldset>
          <legend>Filters</legend>
          <label><input type="checkbox" name="category" value="laptop"> Laptops</label>
          <label><input type="checkbox" name="category" value="phones"> Phones</label>
          <label><input type="checkbox" name="category" value="audio"> Audio</label>
          <label><input type="checkbox" name="category" value="wearable">Wearable</label>
        </fieldset>

        <fieldset>
          <legend>Price</legend>
          <label><input type="checkbox" name="price" value="low"> Under 2000kr</label>
          <label><input type="checkbox" name="price" value="mid">2000kr - 8000kr</label>
          <label><input type="checkbox" name="price" value="high">Above 8000kr</label>
        </fieldset>

        <button id="applyFilters">Apply Filters</button>
      </aside>

      <section class="products">

        <article class="product-card" data-id="1">
            <a href="product.html?id=1">
                <img src="img/ultraBook.png" alt="UltraBook Pro 14">
                <h3>UltraBook Pro 14</h3>
            </a>
            <p class="price">14000kr</p>
            <button class="add-to-cart">Add to Cart</button>
        </article>

        <article class="product-card" data-id="2">
            <a href="product.html?id=2">
                <img src="img/smartphone.png" alt="Smart X Phone 13">
                <h3>Smart X Phone 13</h3>
            </a>
            <p class="price">9000kr</p>
            <button class="add-to-cart">Add to Cart</button>
        </article>

        <article class="product-card" data-id="3">
            <a href="product.html?id=3">
                <img src="img/headphone.png" alt="NoiseBeat Headphone">
                <h3>NoiseBeat Headphone</h3>
            </a>
            <p class="price">5000kr</p>
            <button class="add-to-cart">Add to Cart</button>
        </article>

        <article class="product-card" data-id="4">
            <a href="product.html?id=4">
                <img src="img/smartwatch.png" alt="WatchPro X">
                <h3>WatchPro X</h3>
            </a>
            <p class="price">3000kr</p>
            <button class="add-to-cart">Add to Cart</button>
        </article>


      </section>
    </main>
<!--SIDE CART-->

<div id="sideCart" class="side-cart">
    <div class="side-cart-header">
        <h2>Your Cart</h2>
        <button id="closeCart" aria-label="Close cart">X</button>
    </div>

    <div id="sideCartItems"></div>

    <div class="side-cart-footer">
        <h3 id="sideCartTotal">Total: 0kr</h3>
        <button id="goToCart">Go to Cart</button>
    </div>
</div>

<script src="js/products.js"></script>
<script src="js/app.js"></script>
    
</body>
</html>
